<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64">
  <!-- Pin & TL Monogram Icon Mark -->
  <g transform="translate(6, 4)">
    <!-- Outer Pin Shape with elegant cutout -->
    <!-- Center of circular head is roughly at (24, 23), radius 17 -->
    <path d="M 24 53 
             L 8.5 27 
             A 17 17 0 1 1 39.5 28 
             C 39.5 31.5 38.5 35 37.5 36" 
          fill="none" 
          stroke="#4A413C" 
          stroke-width="3.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Bottom right arm of the pin -->
    <path d="M 24 53 L 31.5 43.5" 
          fill="none" 
          stroke="#4A413C" 
          stroke-width="3.2" 
          stroke-linecap="round" />

    <!-- "T" -->
    <!-- Top bar -->
    <path d="M 13.5 17.5 L 28.5 17.5" 
          stroke="#4A413C" 
          stroke-width="3.6" 
          stroke-linecap="square" />
    <!-- Vertical stem -->
    <path d="M 19.5 17.5 L 19.5 41" 
          stroke="#4A413C" 
          stroke-width="3.8" 
          stroke-linecap="square" />

    <!-- "L" -->
    <!-- Vertical stem -->
    <path d="M 26.5 24 L 26.5 41" 
          stroke="#4A413C" 
          stroke-width="3.6" 
          stroke-linecap="square" />
    <!-- Horizontal foot -->
    <path d="M 26.5 41 L 37.5 41" 
          stroke="#4A413C" 
          stroke-width="3.6" 
          stroke-linecap="square" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(64, 8)">
    <text x="0" y="30" font-family="'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#4A413C" letter-spacing="-0.5">
      Try<tspan fill="#BB6C43">Local</tspan>
    </text>
    <text x="1" y="44" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#6B5A52" letter-spacing="1.2">
      FASHION HOME TRIALS
    </text>
  </g>
</svg>